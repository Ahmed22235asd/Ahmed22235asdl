<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word in Context</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f0e0d;
    --paper: #f5f0e8;
    --cream: #ede8dc;
    --accent: #c1440e;
    --accent2: #1a5c3a;
    --gold: #b8860b;
    --muted: #7a7060;
    --line: #d4cec3;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 27px,
        #d4cec322 27px,
        #d4cec322 28px
      );
  }

  /* HEADER */
  header {
    border-bottom: 2px solid var(--ink);
    padding: 20px 40px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    background: var(--paper);
    position: sticky; top:0; z-index:50;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 900;
    letter-spacing: -1px;
  }
  .logo-sub {
    font-size: .78rem;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .header-line {
    flex:1; height:1px; background:var(--line); margin: 0 8px;
  }
  .edition {
    font-size: .72rem;
    color: var(--muted);
    text-align: right;
    line-height: 1.5;
    font-weight: 300;
  }

  /* MAIN */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 28px 80px;
  }

  /* SEARCH BOX */
  .search-section {
    text-align: center;
    margin-bottom: 52px;
  }
  .search-eyebrow {
    font-size: .7rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 500;
  }
  .search-headline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 32px;
    color: var(--ink);
  }
  .search-headline em {
    font-style: italic;
    color: var(--accent);
  }

  .input-row {
    display: flex;
    gap: 0;
    max-width: 540px;
    margin: 0 auto;
    border: 2px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 4px 4px 0 var(--ink);
    transition: box-shadow .2s;
  }
  .input-row:focus-within {
    box-shadow: 6px 6px 0 var(--accent);
  }
  .word-input {
    flex: 1;
    padding: 16px 20px;
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-style: italic;
    background: #fff;
    border: none;
    outline: none;
    color: var(--ink);
    letter-spacing: .5px;
  }
  .word-input::placeholder { color: #bbb; font-style: italic; }

  .search-btn {
    padding: 16px 28px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: .85rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  .search-btn:hover { background: var(--accent); }
  .search-btn:disabled { background: var(--muted); cursor:not-allowed; }

  /* RESULTS */
  #results { display: none; }
  #results.show { display: block; animation: unfold .4s ease; }
  @keyframes unfold {
    from { opacity:0; transform: translateY(16px); }
    to { opacity:1; transform: translateY(0); }
  }

  /* WORD HEADER */
  .word-header {
    border-top: 3px double var(--ink);
    border-bottom: 1px solid var(--ink);
    padding: 24px 0 20px;
    margin-bottom: 36px;
    display: flex;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }
  .word-display {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 900;
    color: var(--ink);
    line-height: 1;
  }
  .word-phonetic {
    font-size: 1rem;
    color: var(--muted);
    font-weight: 300;
    font-style: italic;
    padding-bottom: 6px;
  }
  .word-pos {
    margin-left: auto;
    font-size: .72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    border: 1px solid var(--accent);
    padding: 4px 12px;
    border-radius: 2px;
  }
  .play-word-btn {
    background: none;
    border: 2px solid var(--ink);
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items:center; justify-content:center;
    transition: all .2s;
    flex-shrink: 0;
    margin-bottom: 4px;
  }
  .play-word-btn:hover { background: var(--ink); color: var(--paper); }

  /* DEFINITION */
  .definition-block {
    background: var(--cream);
    border-right: 4px solid var(--gold);
    padding: 16px 20px;
    margin-bottom: 36px;
    font-size: .95rem;
    line-height: 1.7;
    color: #333;
  }
  .def-label {
    font-size: .65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }

  /* SENTENCES */
  .sentences-label {
    font-size: .65rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sentences-label::after {
    content:''; flex:1; height:1px; background:var(--line);
  }

  .sentence-item {
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 0 16px;
    margin-bottom: 28px;
    align-items: start;
  }
  .sentence-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--line);
    text-align: center;
    padding-top: 2px;
    line-height: 1;
  }
  .sentence-body {}
  .sentence-source {
    font-size: .68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .sentence-text {
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--ink);
  }
  .sentence-text .highlight {
    color: var(--accent);
    font-weight: 700;
    font-style: italic;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 1px;
  }
  .sentence-translation {
    margin-top: 5px;
    font-size: .83rem;
    color: var(--muted);
    font-style: italic;
    direction: rtl;
    text-align: right;
    font-family: 'Cairo', sans-serif;
  }

  /* LOADING */
  #loading {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }
  #loading.show { display: block; }
  .loading-word {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-style: italic;
    color: var(--muted);
    animation: flicker 1.2s ease-in-out infinite;
  }
  @keyframes flicker {
    0%,100% { opacity:.3 } 50% { opacity:1 }
  }
  .loading-sub {
    font-size: .75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--line);
    margin-top: 12px;
  }

  /* HISTORY */
  .history-section {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 2px solid var(--line);
  }
  .history-label {
    font-size: .65rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    font-weight: 500;
  }
  .history-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-chip {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: .95rem;
    padding: 6px 16px;
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    color: var(--muted);
    transition: all .2s;
    background: transparent;
  }
  .history-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #fff;
  }

  /* ERROR */
  .error-msg {
    text-align: center;
    padding: 40px;
    color: var(--accent);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
  }

  @media(max-width:520px) {
    header { padding: 16px 20px; }
    main { padding: 32px 16px 60px; }
    .input-row { flex-direction: column; box-shadow: 3px 3px 0 var(--ink); }
    .search-btn { width: 100%; padding: 14px; }
    .word-header { gap: 12px; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div>
    <div class="logo">In Context</div>
    <div class="logo-sub">Word Study Tool</div>
  </div>
  <div class="header-line"></div>
  <div class="edition">See every word<br>alive in a sentence</div>
</header>

<main>
  <section class="search-section">
    <div class="search-eyebrow">الكلمة في سياقها الحقيقي</div>
    <h1 class="search-headline">اكتب أي كلمة<br>وشوفها <em>حيّة</em> في جمل</h1>

    <div class="input-row">
      <input
        type="text"
        class="word-input"
        id="word-input"
        placeholder="e.g. serendipity"
        autocomplete="off"
        spellcheck="false"
        dir="ltr"
      >
      <button class="search-btn" id="search-btn" onclick="searchWord()">
        Explore →
      </button>
    </div>
  </section>

  <!-- LOADING -->
  <div id="loading">
    <div class="loading-word" id="loading-word">—</div>
    <div class="loading-sub">Searching the literary world…</div>
  </div>

  <!-- RESULTS -->
  <div id="results">
    <div class="word-header">
      <div class="word-display" id="res-word"></div>
      <div class="word-phonetic" id="res-phonetic"></div>
      <button class="play-word-btn" id="play-main-btn" title="Listen">▶</button>
      <div class="word-pos" id="res-pos"></div>
    </div>

    <div class="definition-block">
      <div class="def-label">Definition</div>
      <div id="res-definition"></div>
    </div>

    <div class="sentences-label">Sentences from real contexts</div>
    <div id="sentences-container"></div>
  </div>

  <!-- HISTORY -->
  <div class="history-section" id="history-section" style="display:none">
    <div class="history-label">Previously looked up</div>
    <div class="history-chips" id="history-chips"></div>
  </div>
</main>

<script>
let currentWord = '';
let history = JSON.parse(localStorage.getItem('wic_history') || '[]');

// ENTER key
document.getElementById('word-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') searchWord();
});

function updateHistory(word) {
  history = [word, ...history.filter(w => w !== word)].slice(0, 12);
  localStorage.setItem('wic_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const section = document.getElementById('history-section');
  const chips = document.getElementById('history-chips');
  if(history.length === 0) { section.style.display='none'; return; }
  section.style.display = 'block';
  chips.innerHTML = history.map(w =>
    `<button class="history-chip" onclick="loadWord('${w}')">${w}</button>`
  ).join('');
}

function loadWord(word) {
  document.getElementById('word-input').value = word;
  searchWord();
}

async function searchWord() {
  const word = document.getElementById('word-input').value.trim();
  if(!word) return;
  currentWord = word;

  document.getElementById('loading-word').textContent = word;
  document.getElementById('loading').classList.add('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('search-btn').disabled = true;

  try {
    const prompt = `You are a world-class English vocabulary teacher and literary expert.

The user wants to deeply understand the word: "${word}"

Respond ONLY with a valid JSON object, no markdown, no backticks, no explanation outside JSON.

JSON structure:
{
  "word": "${word}",
  "phonetic": "IPA pronunciation e.g. /ˌsɛr.ənˈdɪp.ɪ.ti/",
  "partOfSpeech": "noun / verb / adjective / etc.",
  "definition": "Clear, rich definition in 1-2 sentences. Show nuance.",
  "sentences": [
    {
      "source": "Source type e.g. Novel · Literary Fiction / News Article · BBC / Academic Paper / Business Email / Everyday Speech / Song Lyrics / Film Dialogue / Scientific Writing / Historical Document",
      "sentence": "A complete, natural sentence using the word. Make it vivid and memorable. The word should appear naturally.",
      "translation": "ترجمة الجملة بالعربية"
    }
  ]
}

Rules:
- sentences array must have EXACTLY 10 items
- Each sentence from a DIFFERENT context/source type (vary widely: literature, news, science, business, casual, film, poetry, history, etc.)
- The word must appear in each sentence — sometimes inflected (e.g. running, ran) is OK
- Sentences should be genuinely useful for a language learner — show different shades of meaning
- Make them interesting, not boring
- Arabic translation should be natural Egyptian Arabic (عربي مصري طبيعي)
- Return ONLY the JSON object`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await response.json();
    const raw = data.content.map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    renderResults(parsed);
    updateHistory(parsed.word);

  } catch(err) {
    console.error(err);
    document.getElementById('loading').classList.remove('show');
    document.getElementById('results').innerHTML = `<div class="error-msg">Something went wrong — please try again.</div>`;
    document.getElementById('results').classList.add('show');
  }

  document.getElementById('search-btn').disabled = false;
}

function renderResults(data) {
  document.getElementById('loading').classList.remove('show');

  document.getElementById('res-word').textContent = data.word;
  document.getElementById('res-phonetic').textContent = data.phonetic || '';
  document.getElementById('res-pos').textContent = data.partOfSpeech || '';
  document.getElementById('res-definition').textContent = data.definition || '';

  // Highlight word in sentence
  function highlightWord(sentence, word) {
    const base = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`\\b(${base}\\w*)\\b`, 'gi');
    return sentence.replace(regex, '<span class="highlight">$1</span>');
  }

  const container = document.getElementById('sentences-container');
  container.innerHTML = (data.sentences || []).map((s, i) => `
    <div class="sentence-item">
      <div class="sentence-num">${String(i+1).padStart(2,'0')}</div>
      <div class="sentence-body">
        <div class="sentence-source">${s.source}</div>
        <div class="sentence-text">${highlightWord(s.sentence, data.word)}</div>
        ${s.translation ? `<div class="sentence-translation">${s.translation}</div>` : ''}
      </div>
    </div>
  `).join('');

  document.getElementById('results').classList.add('show');

  // Play button for main word
  document.getElementById('play-main-btn').onclick = () => speak(data.word);
}

function speak(word) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.8;
  window.speechSynthesis.speak(u);
}

// Init
renderHistory();
</script>
</body>
</html>
